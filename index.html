<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>উপসংহার — Handmade Store</title>
<style>body{margin:0;background:#faf7f1;color:#211c16;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{padding:55px 20px;text-align:center;background:#eee4d5}h1{font-size:52px;margin:0 0 10px}.sub{color:#74695d}main{max-width:1000px;margin:auto;padding:40px 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid #e8ddcf;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover}.body{padding:16px}.price{font-size:22px;font-weight:800}.stock{color:#5d6c55;font-size:13px;margin:8px 0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><h1>উপসংহার</h1><div class="sub">HANDMADE WITH LOVE</div><p>Handmade jeans • jewellery • rakhi • more</p></header>
<main><h2>Shop Collection</h2><div id="products" class="grid">Loading...</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<script>
async function load(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});const el=document.getElementById('products');if(error){el.textContent='Products could not be loaded.';console.error(error);return}el.innerHTML=data.map(p=>`<article class="card"><img src="${p.image_url||'assets/handmade-rakhi.jpg'}" alt=""><div class="body"><h3>${p.name}</h3><div class="price">₹${p.price}</div><div class="stock">Stock: ${p.stock}${p.customisable?' • Customise available':''}</div><p>${p.description||''}</p></div></article>`).join('')||'<p>No products yet.</p>'}load();
</script></body></html>
