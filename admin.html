<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uposonhar Admin</title>
<style>body{margin:0;background:#f7f3ec;color:#211c16;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}.wrap{max-width:800px;margin:auto;padding:30px 18px}.box{background:white;border:1px solid #e5dacb;border-radius:18px;padding:22px;margin:15px 0}input,textarea{width:100%;padding:11px;border:1px solid #d6c9b8;border-radius:9px;margin:5px 0 12px;font:inherit;box-sizing:border-box}button{padding:11px 16px;border:0;border-radius:9px;background:#211c16;color:white;font-weight:700;cursor:pointer}.danger{background:#a23d35}.item{display:flex;gap:14px;align-items:center;border-top:1px solid #eee;padding:13px 0}.item img{width:65px;height:65px;object-fit:cover;border-radius:9px}.muted{color:#74695d;font-size:13px}.hidden{display:none}</style></head><body><div class="wrap">
<h1>উপসংহার — Admin</h1><div id="status" class="muted"></div>
<div id="login" class="box"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p class="muted">Use the same email/password you create in Supabase Authentication.</p></div>
<div id="panel" class="hidden"><div class="box"><button onclick="logout()">Logout</button><h2>Add Product</h2><input id="name" placeholder="Product name"><input id="price" type="number" min="0" placeholder="Price"><input id="stock" type="number" min="0" placeholder="Stock"><input id="image" type="file" accept="image/*"><textarea id="desc" placeholder="Description"></textarea><label><input id="custom" type="checkbox" checked style="width:auto"> Customisable</label><button onclick="addProduct()">Add Product</button></div>
<div class="box"><h2>Products</h2><div id="list">Loading...</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<script>
const statusEl=document.getElementById('status');
async function check(){const {data}=await sb.auth.getSession();if(data.session){document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');load()}else{document.getElementById('login').classList.remove('hidden');document.getElementById('panel').classList.add('hidden')}} 
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){statusEl.textContent=error.message;return}statusEl.textContent='Logged in';check()}
async function logout(){await sb.auth.signOut();check()}
async function addProduct(){const name=document.getElementById('name').value.trim(),price=Number(document.getElementById('price').value),stock=Number(document.getElementById('stock').value),file=document.getElementById('image').files[0],desc=document.getElementById('desc').value.trim(),custom=document.getElementById('custom').checked;if(!name||!file){alert('Name and image are required');return}const ext=file.name.split('.').pop().toLowerCase(),path=crypto.randomUUID()+'.'+ext;let {error}=await sb.storage.from('product-images').upload(path,file);if(error){alert(error.message);return}const {data:{publicUrl}}=sb.storage.from('product-images').getPublicUrl(path);({error}=await sb.from('products').insert({name,price,stock,image_url:publicUrl,description:desc,customisable:custom}));if(error){alert(error.message);return}document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('stock').value='';document.getElementById('image').value='';document.getElementById('desc').value='';load()}
async function load(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});const el=document.getElementById('list');if(error){el.textContent=error.message;return}el.innerHTML=data.map(p=>`<div class="item"><img src="${p.image_url||''}"><div style="flex:1"><b>${p.name}</b><br>₹${p.price} • Stock ${p.stock}</div><button class="danger" onclick="removeProduct(${p.id})">Delete</button></div>`).join('')||'No products'}
async function removeProduct(id){if(!confirm('Delete this product?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else load()}
check();
</script></body></html>
